[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "transcripts-api"
version = "0.1.0"
description = "FastAPI backend for transcripts"
requires-python = ">=3.8.1"
dependencies = [
    "transcripts",
    "fastapi>=0.109.0",
    "starlette>=0.39.0",  # FileResponse byte ranges for native video seeking
    "uvicorn[standard]>=0.27.0",
]

[project.scripts]
api = "api.main:run"
